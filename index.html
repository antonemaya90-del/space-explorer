<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Explorer</title>
<meta name="description" content="Space Explorer by team Stellar02: an educational 2D game based on the Apollo 11 mission.">
<style>
  :root {
    --bg: #070b24;
    --panel: #10163a;
    --text: #e8ebff;
    --muted: #9aa3d6;
    --accent: #8b6cff;
    --accent-2: #3fc1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1a1550 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; max-width: 1200px; width: 100%; margin: 0 auto;
  }
  h1 { font-size: 1.1rem; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
  h1 span { color: var(--muted); font-weight: 400; letter-spacing: .04em; text-transform: none; font-size: .9rem; margin-left: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); color: var(--text); border: 1px solid #2a3170;
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: .9rem;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .actions { display: flex; gap: 8px; }

  main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px #232a66;
  }
  .stage img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .nav {
    position: absolute; top: 0; bottom: 0; width: 18%;
    background: transparent; border: 0; cursor: pointer; color: #fff;
    display: flex; align-items: center; padding: 0 12px; opacity: 0; transition: opacity .2s;
  }
  .nav.prev { left: 0; justify-content: flex-start; }
  .nav.next { right: 0; justify-content: flex-end; }
  .stage:hover .nav, .nav:focus-visible { opacity: 1; }
  .nav svg { width: 44px; height: 44px; background: rgba(7,11,36,.6); border-radius: 50%; padding: 10px; }
  .nav[disabled] { visibility: hidden; }

  .bar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 0; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }

  .thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 18px; scrollbar-width: thin; }
  .thumbs button {
    flex: 0 0 auto; width: 140px; aspect-ratio: 16 / 9; padding: 0; border-radius: 6px; overflow: hidden;
    border: 2px solid transparent; background: #000; cursor: pointer; opacity: .6; transition: opacity .2s, border-color .2s;
  }
  .thumbs button:hover { opacity: .9; }
  .thumbs button[aria-current="true"] { border-color: var(--accent); opacity: 1; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 8px 16px 20px; }

  .stage:fullscreen { border-radius: 0; aspect-ratio: auto; width: 100vw; height: 100vh; }

  @media (max-width: 600px) {
    h1 span { display: none; }
    .btn .label { display: none; }
    .thumbs button { width: 96px; }
    .nav { opacity: 1; width: 22%; }
    .nav svg { width: 34px; height: 34px; padding: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>Space Explorer <span>Team Stellar02</span></h1>
  <div class="actions">
    <button class="btn" id="fs" type="button" aria-label="Full screen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span class="label">Full screen</span>
    </button>
    <a class="btn" href="SPACE%20EXPLORER.pptx" download aria-label="Download PowerPoint file">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
      <span class="label">Download .pptx</span>
    </a>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <img id="slide" src="slides/slide-01.png" alt="">
    <button class="nav prev" id="prev" type="button" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="nav next" id="next" type="button" aria-label="Next slide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="bar">
    <span class="counter" id="counter" aria-live="polite">1 / 7</span>
  </div>
  <nav class="thumbs" id="thumbs" aria-label="Slides"></nav>
</main>

<footer>Use ← → arrow keys or swipe to move between slides.</footer>

<script>
  const slides = [
    { title: "Space Explorer", text: "Space Explorer. Team name: Stellar02. Team members: Antone Maya Alessya, Zamfir Robert Mihail, Popescu Cezar Petru." },
    { title: "The Challenge", text: "The Challenge: Space Mission Design Game. Pupils and students have few opportunities to interactively experience the design of a space mission and to understand how technical decisions and limited resources influence its success. The game turns these abstract concepts into a hands-on experience." },
    { title: "The Solution", text: "The solution to the problem: a 2D simulation-adventure game based on real data from the Apollo 11 mission, where players make engineering decisions and manage limited resources, with its own storyline." },
    { title: "Game Summary", text: "Game Summary: the player is a NASA flight engineer between 1961 and 1969, planning a mission to send a human to the Moon and back. Decisions affect four resources: budget, mass, power and schedule, plus overall mission risk." },
    { title: "Game Summary (continued)", text: "Game Summary: the game has several stages, from spacecraft construction to the lunar landing. Players' decisions are compared with NASA's actual Apollo 11 choices, combining strategy, simulation and history." },
    { title: "NASA & Space Data Integration", text: "NASA and space data integration: open data from the Apollo 11 mission report, press kits, the Apollo Lunar Surface Journal and NSSDC records is used to shape the game mechanics, levels and story." },
    { title: "Conclusion", text: "Conclusion: the game combines entertainment with education. Future plans include new planets, interactive missions, multiplayer challenges and improved graphics, to make learning about space fun and accessible." }
  ];
  const src = i => `slides/slide-${String(i + 1).padStart(2, "0")}.png`;

  const img = document.getElementById("slide");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const thumbs = document.getElementById("thumbs");
  const stage = document.getElementById("stage");
  let current = 0;

  slides.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", `Slide ${i + 1}: ${s.title}`);
    b.innerHTML = `<img src="${src(i)}" alt="" loading="lazy">`;
    b.addEventListener("click", () => go(i));
    thumbs.appendChild(b);
  });

  function go(i) {
    current = Math.max(0, Math.min(slides.length - 1, i));
    img.src = src(current);
    img.alt = slides[current].text;
    counter.textContent = `${current + 1} / ${slides.length}`;
    prev.disabled = current === 0;
    next.disabled = current === slides.length - 1;
    [...thumbs.children].forEach((b, j) => b.setAttribute("aria-current", j === current ? "true" : "false"));
    thumbs.children[current].scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    if (current + 1 < slides.length) new Image().src = src(current + 1);
    history.replaceState(null, "", `#${current + 1}`);
  }

  prev.addEventListener("click", () => go(current - 1));
  next.addEventListener("click", () => go(current + 1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(current + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(current - 1); }
    if (e.key === "Home") go(0);
    if (e.key === "End") go(slides.length - 1);
  });

  let startX = null;
  stage.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
    startX = null;
  });

  document.getElementById("fs").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  });

  const fromHash = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(fromHash) ? fromHash - 1 : 0);
</script>
</body>
</html>
